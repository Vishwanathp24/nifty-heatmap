services:
  - type: web
    name: nifty-dashboard
    runtime: python
    plan: starter # NOT free - this app runs a background tracking thread
                  # continuously through market hours; free tier instances
                  # spin down when idle and would silently kill it.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NIFTY_DATA_DIR
        value: /var/data
      # Fyers integration (F&O Scanner real-time quotes, Phase 1) - set these
      # manually in the Render dashboard (Environment tab), never committed
      # here. FYERS_REDIRECT_URI must exactly match the Redirect URL
      # registered on the Fyers app itself (e.g. https://<your-domain>/fyers/callback).
      - key: FYERS_APP_ID
        sync: false
      - key: FYERS_APP_SECRET
        sync: false
      - key: FYERS_REDIRECT_URI
        sync: false
    disk:
      name: intraday-history
      mountPath: /var/data
      sizeGB: 1
